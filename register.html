<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - GoldenTech</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="logo">GoldenTech</div>
  </header>

  <section class="formulario">
    <h2>Crear Cuenta</h2>
    <form id="registerForm">
      <input type="email" id="emailRegister" placeholder="Correo electrónico" required>
      <input type="password" id="passwordRegister" placeholder="Contraseña" required>
      <button type="submit" class="btn">Registrarse</button>
    </form>
  </section>
</body>
</html>
