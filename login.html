<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - GoldenTech</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div class="logo">GoldenTech</div>
  </header>

  <section class="formulario">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
      <input type="email" id="emailLogin" placeholder="Correo electrónico" required>
      <input type="password" id="passwordLogin" placeholder="Contraseña" required>
      <button type="submit" class="btn">Entrar</button>
      <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
    </form>
  </section>
</body>
</html>
